# https://release-plz.dev/docs/config
[workspace]
# Publish only when the release PR is merged, never on ordinary merges.
release_always = false
pr_labels = ["release"]
# Before 1.0 a feat commit still raises the minor version (0.1.x -> 0.2.0), not only the patch.
features_always_increment_minor = true
# The GitHub Release comes from dist, which builds the binaries from the tag.
git_release_enable = false

[changelog]
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^refactor", group = "<!-- 4 -->♻️ Refactoring" },
    { message = "^test", group = "<!-- 5 -->🧪 Testing" },
    { message = "^build", group = "<!-- 6 -->🏗️ Build System" },
    { message = "^ci", group = "<!-- 7 -->👷 CI/CD" },
    { message = "^chore\\((release|deps)\\)", skip = true },
    { message = "^chore", group = "<!-- 8 -->🔧 Miscellaneous" },
    { message = "^revert", group = "<!-- 9 -->⏪ Reverts" },
]

# One version for the whole product: the library moves in lockstep with the CLI, and the CLI
# package also covers nix/ and template/ (see `include` in Cargo.toml).
[[package]]
name = "senn"
version_group = "senn"
# The single release tag comes from the CLI.
git_tag_enable = false

[[package]]
name = "senn-cli"
version_group = "senn"
# One tag per release, `v0.2.0`: herds pin it (github:mrbandler/senn/v0.2.0), dist builds from it.
git_tag_name = "v{{ version }}"
# dist takes the GitHub Release notes from a top-level CHANGELOG.md.
changelog_path = "./CHANGELOG.md"

# Shipped as a Nix package from this repo; no crates.io release, no tag.
[[package]]
name = "senn-backend-onepassword"
release = false
publish = false
