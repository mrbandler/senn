# rust-template-cli-v-release.yml is generated by dist; regenerate with `dist generate`, do not hand-edit.
# Its findings below are inherent to dist's workflow and cannot be fixed or ignored inline.
rules:
  excessive-permissions:
    ignore:
      # Top-level `contents: write`: dist creates the GitHub Release.
      - rust-template-cli-v-release.yml
  template-injection:
    ignore:
      # Expansions of dist's own plan outputs, build matrix and the pushed tag name
      # (only users with push access can create tags).
      - rust-template-cli-v-release.yml
  unpinned-images:
    ignore:
      # Matrix container image is chosen by dist; none is set for the configured targets.
      - rust-template-cli-v-release.yml
