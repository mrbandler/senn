# The root package is the CLI (like ripgrep): its sources live in crates/senn-cli/, and the
# root directory makes nix/, template/ and flake.nix part of it.
[package]
name = "senn-cli"
description = "Git-native infrastructure for single operators, built on Nix and OpenTofu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://mrbandler.github.io/senn/"
readme.workspace = true
# The CLI is the product: its sources, the Nix module and the herd template. A change to any of
# these files releases a new version (release-plz looks at the packaged files).
include = [
    "crates/senn-cli/**",
    "nix/**",
    "template/**",
    "/flake.nix",
    "/flake.lock",
    "/README.md",
    "/LICENSE",
]

# The package is `<name>-cli` because the library owns `<name>`; the command is still `<name>`.
[[bin]]
name = "senn"
path = "crates/senn-cli/src/main.rs"
# Shares its name with the library, so `cargo doc` would overwrite the library docs (cargo#6313).
doc = false

[dependencies]
senn.workspace = true
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true
# Homebrew formula named after the command, not the package.
formula = "senn"

[workspace]
resolver = "3"
members = [
    ".",
    "crates/senn",
    "crates/senn-backend-onepassword",
    "crates/senn-protocol",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
authors = ["mrbandler <me@mrbandler.dev>"]
license = "MIT"
repository = "https://github.com/mrbandler/senn"
homepage = "https://mrbandler.github.io/senn/"
readme = "README.md"

[workspace.dependencies]
thiserror = "2.0"
miette = { version = "7.6", default-features = false, features = ["derive"] }
senn = { path = "crates/senn", version = "0.2.0" }
senn-protocol = { path = "crates/senn-protocol", version = "0.2.0" }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Used by dist for release binaries.
[profile.dist]
inherits = "release"
