[workspace]
resolver = "3"
members = [
    "crates/*",
    # init:template:start
    "xtask",
    # init:template:end
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Michael Baudler <hello@mrbandler.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrbandler/rust-template"
homepage = "https://github.com/mrbandler/rust-template"
readme = "README.md"

[workspace.dependencies]
thiserror = "2.0"
miette = { version = "7.6", default-features = false, features = ["derive"] }
# init:bin:start
rust-template = { path = "crates/rust-template", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# init:bin:end

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
# init:bin:start

# Used by dist for release binaries.
[profile.dist]
inherits = "release"
# init:bin:end
