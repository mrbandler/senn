[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "homebrew"]
tap = "mrbandler/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
install-path = "CARGO_HOME"
install-updater = false
github-attestations = true
# Dependabot owns the action SHAs in the generated release workflow (it can't edit this file),
# so dist must not fail when they differ from what `dist generate` would write. After running
# `dist generate`, re-pin the actions to SHAs (zizmor in CI flags unpinned ones).
allow-dirty = ["ci"]
