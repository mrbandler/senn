[package]
name = "senn-cli"
description = "Command-line interface of senn."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# The package is `<name>-cli` because the library owns `<name>`; the command is still `<name>`.
[[bin]]
name = "senn"
path = "src/main.rs"
# Shares its name with the library, so `cargo doc` would overwrite the library docs (cargo#6313).
doc = false

[dependencies]
senn.workspace = true
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

# dist skips `publish = false` packages unless told otherwise.
[package.metadata.dist]
dist = true
# Homebrew formula named after the command, not the package.
formula = "senn"

[package.metadata.wix]
upgrade-guid = "34307908-0529-4279-B02F-8D34FD6B14F5"
path-guid = "4B15510B-AE43-490C-A984-0F11D73410F2"
license = false
eula = false
